<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 930" width="1200" height="930" class="alr" role="img" aria-labelledby="alr-auto-title alr-auto-desc">
<title id="alr-auto-title">Agentic lakehouse reference architecture</title>
<desc id="alr-auto-desc">A stack of seven numbered layers, top (7) to bottom (1): agents; agent interface such as MCP; semantic layer; query engine; catalog; table format such as Apache Iceberg; and object storage. Agents call typed tools over MCP, the interface sends metric requests to the semantic layer, which compiles governed SQL for the query engine. The engine reads table metadata from the catalog, snapshots and manifests from the table format, and Parquet data files from object storage. A governance rail runs beside the agent interface, semantic layer, query engine, and catalog: agent identity, row and column policies, query guardrails, cost caps, audit log, and catalog access control. Diagram by Alex Merced, CC BY 4.0, agenticlakehouse.com.</desc>
<style>
